services:
  postgres:
    image: postgres:16-alpine
    container_name: mpec-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - mpec_pgdata:/var/lib/postgresql/data
    restart: on-failure
    ports:
      - 5430:5432
    networks:
      - mpec_net
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mpec-pgadmin
    restart: on-failure
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - 5440:80
    networks:
      - mpec_net

networks:
  mpec_net:

volumes:
  mpec_pgdata: