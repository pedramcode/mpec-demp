services:
  mpec:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mpec-service
    restart: on-failure
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_USERNAME=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - PORT=3000
    ports:
      - 3000:3000
    volumes:
      - ./src:/app/src
    depends_on:
      - postgres
    networks:
      - mpec_net

  postgres:
    image: postgres:16-alpine
    container_name: mpec-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - mpec_pgdata:/var/lib/postgresql/data
    restart: on-failure
    ports:
      - 5430:5432
    networks:
      - mpec_net
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mpec-pgadmin
    restart: on-failure
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - 5440:80
    depends_on:
      - postgres
    networks:
      - mpec_net

networks:
  mpec_net:
    driver: bridge

volumes:
  mpec_pgdata: